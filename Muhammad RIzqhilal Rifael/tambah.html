<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Voucher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="body">

    <div class="body">
    <nav class="navbar navbar-expand-lg bg-light">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Toko online</a>
      <a class="nav-link" href="index.html">Daftar Data</a>
      <a class="nav-link" href="tambah.html">Tambah Data</a>
    </div>
  </nav>

    <div class="container">
        <h1>Tambah Voucher</h1>
        <br>

    <form method="post">

        <div class="mb-3">
        <label for="Kode">Kode Promo</label>
         <input type="text" class="form control" id="kode" name="kode">
        </div>

  <div class="mb-3">
    <label for="Jenis">Jenis Diskon</label>
      <select class="form select" id="Jenis" name="Jenis">
        <option value="Persen">Persen</option>
        <option value="Nominal">Nominal</option>
      </select>
  </div>

    <div class="mb-3">
     <label for="nilai">Nilai Diskon</label>
     <input type="text" class="form control" id="nilai" name="nilai">
    </div>

    <div class="mb-3">
     <label for="min">Minimal Belanja</label>
     <input type="text" class="form control" id="min" name="min">
    </div>


    <div class="mb-3">
     <label for="sampai">Berlaku Sampai</label>
     <input type="date" class="form control" id="sampai" name="sampai">
    </div>

      <div class="mb-3">
                <label class="form-label">Status</label><br>
                <input type="radio" name="status" value="Aktif" checked> Aktif
                <input type="radio" name="status" value="Nonaktif" class="ms-3"> Nonaktif
            </div>

  <button type="submit" class="btn btn-primary">Submit</button>
</form>

</div>
</div>
</body>
</html>
