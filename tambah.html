<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pelanggan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
 <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #1b5e50;">
        <div class="container">
            <a class="navbar-brand" href="index.html">Toko Online UMKM</a>
            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Daftar Pelanggan</a>
                <a class="nav-link active" href="tambah.html">Tambah Pelanggan</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="kotak-konten">
            <h2 class="judul-halaman">Tambah Pelanggan</h2>

            <form method="POST" action="tambah.php">
                <div class="row g-3 mb-3">

                    <div class="col-md-6">
                        <label for="nama" class="form-label">Nama</label>
                        <input type="text" class="form-control" id="nama" name="nama" required>
                    </div>

                    <div class="col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="col-md-6">
                        <label for="no_hp" class="form-label">No Hp</label>
                        <input type="tel" class="form-control" id="no_hp" name="no_hp" required>
                    </div>

                    <div class="col-md-6">
                        <span class="form-label d-block">Jenis Kelamin</span>
                        <div class="form-check form-check-inline mt-2">
                            <input class="form-check-input" type="radio" name="jenis_kelamin" id="lk" value="Laki-laki" checked>
                            <label class="form-check-label" for="lk">Laki-laki</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="jenis_kelamin" id="pr" value="Perempuan">
                            <label class="form-check-label" for="pr">Perempuan</label>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="label_alamat" class="form-label">Label Alamat</label>
                        <select class="form-select" id="label_alamat" name="label_alamat" required>
                            <option value="Rumah">Rumah</option>
                            <option value="Kantor">Kantor</option>
                            <option value="Apartemen">Apartemen</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label for="alamat" class="form-label">Alamat</label>
                        <textarea class="form-control" id="alamat" name="alamat" rows="2" required></textarea>
                    </div>

                    <div class="col-md-4">
                        <label for="kota" class="form-label">Kota</label>
                        <input type="text" class="form-control" id="kota" name="kota" required>
                    </div>

                    <div class="col-md-4">
                        <label for="provinsi" class="form-label">Provinsi</label>
                        <input type="text" class="form-control" id="provinsi" name="provinsi" required>
                    </div>

                    <div class="col-md-4">
                        <label for="kode_pos" class="form-label">Kode Pos</label>
                        <input type="text" class="form-control" id="kode_pos" name="kode_pos" maxlength="5" required>
                    </div>

                    <div class="col-12">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="utama" name="utama" value="1">
                            <label class="form-check-label" for="utama">Jadikan alamat utama</label>
                        </div>
                    </div>

                </div>

                <button type="submit" class="btn btn-success">Simpan Pelanggan</button>
                <a href="index.html" class="btn btn-outline-secondary">Kembali ke Daftar</a>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
